<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conjugación v2 · Juego de verbos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #1e2b3a 0%, #0f1a24 100%);
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      padding: 16px;
    }
    .app-container {
      max-width: 1100px; width: 100%;
      background: rgba(22, 34, 48, 0.85);
      backdrop-filter: blur(8px);
      border-radius: 48px;
      padding: 32px 28px;
      box-shadow: 0 30px 45px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,215,120,0.15);
      border: 1px solid rgba(255,210,100,0.3);
      transition: all 0.2s;
    }
    h1 {
      font-size: 2.4rem; font-weight: 600; letter-spacing: 2px;
      color: #f7e9c3; text-align: center;
      text-shadow: 0 4px 10px #00000050, 0 0 10px #b8860b30;
      margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }
    h1 span {
      font-size: 2rem; background: #e6b84c; color: #1e2b3a;
      border-radius: 60px; padding: 0 16px; line-height: 1.4;
      box-shadow: inset 0 -3px 0 #8a6d2b;
    }
    .main-menu { display: flex; flex-direction: column; gap: 22px; }
    .selector-group {
      background: #15222e; border-radius: 60px; padding: 14px 24px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border: 1px solid #42586e;
      box-shadow: inset 0 2px 6px #00000040, 0 6px 10px #00000030;
    }
    .selector-group label {
      color: #bdd1e2; font-weight: 500; font-size: 1.2rem;
      display: flex; align-items: center; gap: 10px;
    }
    .radio-group { display: flex; gap: 18px; flex-wrap: wrap; }
    .radio-group label {
      display: flex; align-items: center; gap: 8px;
      font-weight: 400; color: #e9edf2; cursor: pointer; font-size: 1.1rem;
      background: #1f3142; padding: 8px 18px; border-radius: 40px;
      border: 1px solid #3f5a72; transition: 0.15s;
    }
    .radio-group label:hover { background: #2e465c; border-color: #c9a24b; }
    .radio-group input[type="radio"] { accent-color: #e6b84c; width: 18px; height: 18px; cursor: pointer; }
    .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
    .menu-btn {
      background: #1d2f3f; border: none; border-radius: 40px;
      padding: 24px 10px; font-size: 1.4rem; font-weight: 600; color: #f2e7d5;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; border-bottom: 4px solid #0d1a24;
      box-shadow: 0 10px 15px -5px #00000060, inset 0 1px 0 #8faec9;
      transition: all 0.12s; letter-spacing: 0.5px;
    }
    .menu-btn small { font-size: 0.9rem; font-weight: 400; color: #b8cfdf; letter-spacing: 0.3px; }
    .menu-btn:hover {
      background: #264a60; border-bottom-color: #c9a24b;
      transform: scale(1.01); color: #fff9e6;
    }
    .menu-btn:active { transform: scale(0.98); border-bottom-width: 2px; }
    .player-section {
      background: #0e1a23; border-radius: 32px; padding: 22px 28px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      border: 1px solid #3a5065; margin-top: 8px;
    }
    .player-input-area { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .player-input-area input {
      background: #1f2f3d; border: 1px solid #5d7b93; border-radius: 40px;
      padding: 14px 22px; font-size: 1.1rem; color: #fff; outline: none; width: 240px;
    }
    .player-input-area input::placeholder { color: #93aec3; font-style: italic; }
    .player-input-area input:focus { border-color: #e6b84c; box-shadow: 0 0 0 3px #e6b84c30; }
    .player-btn {
      background: #e6b84c; border: none; border-radius: 40px;
      padding: 14px 30px; font-weight: 700; font-size: 1.1rem; color: #0f1a24;
      cursor: pointer; transition: 0.1s; box-shadow: 0 5px 0 #9e7d2b;
      border-bottom: 1px solid #f5d88c;
    }
    .player-btn:hover { background: #f5cd6b; transform: translateY(-1px); box-shadow: 0 6px 0 #9e7d2b; }
    .player-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9e7d2b; }
    .player-badge {
      background: #2c4153; border-radius: 60px; padding: 10px 24px;
      color: #f2e7d5; font-weight: 500; font-size: 1.1rem;
      display: flex; align-items: center; gap: 8px;
    }
    .player-badge span {
      background: #e6b84c; color: #1e2b3a; border-radius: 50px;
      padding: 2px 14px; font-weight: 700;
    }
    .results-panel {
      background: #0b151d; border-radius: 30px; padding: 20px 24px;
      margin-top: 18px; border: 1px solid #4e6c82;
    }
    .results-panel h3 {
      color: #e6b84c; font-weight: 500; letter-spacing: 1px;
      margin-bottom: 14px; font-size: 1.4rem;
      border-left: 6px solid #e6b84c; padding-left: 16px;
    }
    .results-list {
      display: flex; flex-direction: column; gap: 10px;
      max-height: 220px; overflow-y: auto; padding-right: 6px;
    }
    .results-list::-webkit-scrollbar { width: 6px; background: #1e2e3b; border-radius: 10px; }
    .results-list::-webkit-scrollbar-thumb { background: #b8974b; border-radius: 10px; }
    .result-item {
      background: #182734; border-radius: 20px; padding: 12px 20px;
      display: grid; grid-template-columns: 1.4fr 1fr 1fr;
      align-items: center; gap: 12px;
      color: #dbe8f2; font-size: 0.98rem;
      border-left: 8px solid #e6b84c;
    }
    .result-item .name { font-weight: 700; color: #fff0cf; }
    .result-item .time { color: #b8cfdf; font-variant-numeric: tabular-nums; }
    .result-item .score {
      background: #1e3b4b; padding: 4px 14px; border-radius: 40px;
      font-weight: 600; font-size: 0.9rem; justify-self: end;
    }
    .empty-msg { color: #7d95a8; font-style: italic; text-align: center; padding: 12px; }

    /* ---------- PANTALLAS DE JUEGO ---------- */
    .game-screen { display: none; flex-direction: column; gap: 24px; }
    .game-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f1e2a; border-radius: 40px; padding: 12px 24px;
      border: 1px solid #b8974b70;
    }
    .game-header .info {
      display: flex; gap: 28px; color: #c9dbe9; font-weight: 500; align-items: center;
    }
    .game-header .info span {
      background: #1e3343; padding: 8px 22px; border-radius: 40px;
      color: #f2e7d5; font-weight: 600;
    }
    .timer {
      font-size: 1.5rem; font-weight: 700; color: #f5d88c;
      font-variant-numeric: tabular-nums;
      background: #1d2e3b; padding: 6px 24px; border-radius: 50px;
      letter-spacing: 2px; border: 1px solid #b8974b;
    }
    .question-box {
      background: #152835; border-radius: 48px; padding: 40px 30px;
      text-align: center; font-size: 2.1rem; font-weight: 600; color: #fcf3e1;
      box-shadow: inset 0 -4px 0 #0f1a24, 0 12px 20px -10px black;
      border: 1px solid #4f7a9b; letter-spacing: 0.5px;
    }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 6px; }
    .option-btn {
      background: #1d3648; border: none; border-radius: 40px;
      padding: 22px 16px; font-size: 1.3rem; font-weight: 500; color: #ecf3fa;
      text-align: center; cursor: pointer; transition: 0.1s;
      border-bottom: 5px solid #0b161f; box-shadow: 0 5px 10px #00000040;
      word-break: break-word;
    }
    .option-btn:hover { background: #2b5370; border-bottom-color: #e6b84c; transform: scale(1.01); }
    .option-btn.correct { background: #2e7d5e; border-bottom-color: #1e4d3a; pointer-events: none; }
    .option-btn.incorrect { background: #a13e4b; border-bottom-color: #5e1f2a; pointer-events: none; }
    .option-btn:disabled { opacity: 0.85; cursor: default; transform: none; }
    .game-footer { display: flex; justify-content: space-between; margin-top: 6px; align-items: center; }
    .back-btn {
      background: #2b3d4d; border: none; border-radius: 40px;
      padding: 14px 30px; color: #f0e9d8; font-size: 1.1rem;
      cursor: pointer; transition: 0.1s; border-bottom: 3px solid #121f29; font-weight: 500;
    }
    .back-btn:hover { background: #3d566b; border-bottom-color: #b8974b; }
    .feedback { font-size: 1.2rem; font-weight: 500; color: #e6b84c; }

    /* ---------- PANTALLA DE RESULTADO FINAL ---------- */
    .result-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 40px 20px;
      background: #0e1c26;
      border-radius: 40px;
      border: 1px solid #b8974b80;
      box-shadow: inset 0 0 40px #00000080;
    }
    .result-screen h2 {
      font-size: 2rem;
      color: #f5d88c;
      text-shadow: 0 2px 8px #000000;
      letter-spacing: 1px;
    }
    .result-big-score {
      font-size: 4.5rem;
      font-weight: 800;
      color: #e6b84c;
      text-shadow: 0 4px 0 #7a5e1f, 0 8px 20px #000000;
      line-height: 1;
    }
    .result-details {
      display: flex;
      gap: 40px;
      color: #c9dbe9;
      font-size: 1.15rem;
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }
    .result-details div span { color: #f5d88c; font-weight: 700; }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <!-- MENÚ PRINCIPAL -->
  <div id="mainMenu">
    <h1>⚡ Conjugación <span>v2</span></h1>

    <div class="main-menu">
      <!-- Selector de conjugaciones -->
      <div class="selector-group">
        <label>Modo verbal:</label>
        <div class="radio-group" id="tipoConjugacion">
          <label><input type="radio" name="conj" value="indicativo" checked> Indicativo</label>
          <label><input type="radio" name="conj" value="subjuntivo"> Subjuntivo</label>
          <label><input type="radio" name="conj" value="todos"> Todos</label>
        </div>
      </div>

      <!-- Botones de juego -->
      <div class="buttons-grid">
        <button class="menu-btn" id="btnTiempos">
          🕰️ Tiempos verbales
          <small>¿Qué verbo está en el tiempo?</small>
        </button>
        <button class="menu-btn" id="btnAnalisis">
          🔍 Análisis de conjugación
          <small>Identifica el tiempo</small>
        </button>
      </div>

      <!-- Añadir jugador -->
      <div class="player-section">
        <div class="player-input-area">
          <input type="text" id="playerNameInput" placeholder="Nombre del jugador" maxlength="20">
          <button class="player-btn" id="addPlayerBtn">➕ Añadir jugador</button>
        </div>
        <div class="player-badge" id="playerBadge">
          👤 Jugador: <span id="currentPlayerDisplay">Invitado</span>
        </div>
      </div>

      <!-- Últimos resultados -->
      <div class="results-panel">
        <h3>📋 Últimos resultados</h3>
        <div class="results-list" id="resultsList">
          <div class="empty-msg">Aún no hay partidas jugadas</div>
        </div>
      </div>
    </div>
  </div>

  <!-- PANTALLA DE JUEGO (compartida) -->
  <div id="gameScreen" class="game-screen">
    <div id="gamePlayArea" style="display:flex; flex-direction:column; gap:24px;">
      <div class="game-header">
        <div class="info">
          <span id="gameModeLabel">Tiempos verbales</span>
          <span id="questionCounter">1 / 20</span>
        </div>
        <div class="timer" id="timerDisplay">10:00</div>
      </div>

      <div class="question-box" id="questionText">Cargando pregunta...</div>

      <div class="options-grid" id="optionsContainer"></div>

      <div class="game-footer">
        <button class="back-btn" id="backToMenuBtn">← Volver al menú</button>
        <div class="feedback" id="feedbackMsg"></div>
      </div>
    </div>

    <!-- Pantalla de resultado final (sin pop-up) -->
    <div id="resultScreen" class="result-screen">
      <h2 id="resultTitle">¡Juego terminado!</h2>
      <div class="result-big-score" id="resultBigScore">0 / 20</div>
      <div class="result-details">
        <div>Jugador: <span id="resultName">Invitado</span></div>
        <div>Tiempo dedicado: <span id="resultTime">00:00</span></div>
        <div>Modo: <span id="resultMode">Tiempos</span></div>
      </div>
      <button class="back-btn" id="resultBackBtn" style="font-size:1.2rem; padding:16px 40px;">← Volver al menú principal</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- DATOS DE VERBOS Y CONJUGACIONES ----------
    const VERBOS = [
      { verbo: "hablar", conjugaciones: {
        indicativo: {
          presente: "hablo", preterito: "hablé", imperfecto: "hablaba", futuro: "hablaré", condicional: "hablaría", 
          preteritoPerfecto: "he hablado", pluscuamperfecto: "había hablado", futuroPerfecto: "habré hablado"
        },
        subjuntivo: {
          presente: "hable", imperfecto: "hablara", futuro: "hablare", preteritoPerfecto: "haya hablado", pluscuamperfecto: "hubiera hablado"
        }
      }},
      { verbo: "comer", conjugaciones: {
        indicativo: {
          presente: "como", preterito: "comí", imperfecto: "comía", futuro: "comeré", condicional: "comería",
          preteritoPerfecto: "he comido", pluscuamperfecto: "había comido", futuroPerfecto: "habré comido"
        },
        subjuntivo: {
          presente: "coma", imperfecto: "comiera", futuro: "comiere", preteritoPerfecto: "haya comido", pluscuamperfecto: "hubiera comido"
        }
      }},
      { verbo: "vivir", conjugaciones: {
        indicativo: {
          presente: "vivo", preterito: "viví", imperfecto: "vivía", futuro: "viviré", condicional: "viviría",
          preteritoPerfecto: "he vivido", pluscuamperfecto: "había vivido", futuroPerfecto: "habré vivido"
        },
        subjuntivo: {
          presente: "viva", imperfecto: "viviera", futuro: "viviere", preteritoPerfecto: "haya vivido", pluscuamperfecto: "hubiera vivido"
        }
      }},
      { verbo: "tener", conjugaciones: {
        indicativo: {
          presente: "tengo", preterito: "tuve", imperfecto: "tenía", futuro: "tendré", condicional: "tendría",
          preteritoPerfecto: "he tenido", pluscuamperfecto: "había tenido", futuroPerfecto: "habré tenido"
        },
        subjuntivo: {
          presente: "tenga", imperfecto: "tuviera", futuro: "tuviere", preteritoPerfecto: "haya tenido", pluscuamperfecto: "hubiera tenido"
        }
      }},
      { verbo: "ir", conjugaciones: {
        indicativo: {
          presente: "voy", preterito: "fui", imperfecto: "iba", futuro: "iré", condicional: "iría",
          preteritoPerfecto: "he ido", pluscuamperfecto: "había ido", futuroPerfecto: "habré ido"
        },
        subjuntivo: {
          presente: "vaya", imperfecto: "fuera", futuro: "fuere", preteritoPerfecto: "haya ido", pluscuamperfecto: "hubiera ido"
        }
      }},
      { verbo: "ser", conjugaciones: {
        indicativo: {
          presente: "soy", preterito: "fui", imperfecto: "era", futuro: "seré", condicional: "sería",
          preteritoPerfecto: "he sido", pluscuamperfecto: "había sido", futuroPerfecto: "habré sido"
        },
        subjuntivo: {
          presente: "sea", imperfecto: "fuera", futuro: "fuere", preteritoPerfecto: "haya sido", pluscuamperfecto: "hubiera sido"
        }
      }},
      { verbo: "saber", conjugaciones: {
        indicativo: {
          presente: "sé", preterito: "supe", imperfecto: "sabía", futuro: "sabré", condicional: "sabría",
          preteritoPerfecto: "he sabido", pluscuamperfecto: "había sabido", futuroPerfecto: "habré sabido"
        },
        subjuntivo: {
          presente: "sepa", imperfecto: "supiera", futuro: "supiere", preteritoPerfecto: "haya sabido", pluscuamperfecto: "hubiera sabido"
        }
      }},
      { verbo: "decir", conjugaciones: {
        indicativo: {
          presente: "digo", preterito: "dije", imperfecto: "decía", futuro: "diré", condicional: "diría",
          preteritoPerfecto: "he dicho", pluscuamperfecto: "había dicho", futuroPerfecto: "habré dicho"
        },
        subjuntivo: {
          presente: "diga", imperfecto: "dijera", futuro: "dijere", preteritoPerfecto: "haya dicho", pluscuamperfecto: "hubiera dicho"
        }
      }}
    ];

    // Etiquetas de tiempo (actualizada: "preterito" → "Pretérito perfecto simple")
    const ETIQUETAS_TIEMPO = {
      presente: "Presente",
      preterito: "Pretérito perfecto simple",
      imperfecto: "Pretérito imperfecto",
      futuro: "Futuro simple",
      condicional: "Condicional simple",
      preteritoPerfecto: "Pretérito perfecto compuesto",
      pluscuamperfecto: "Pluscuamperfecto",
      futuroPerfecto: "Futuro perfecto"
    };

    // ---------- ESTADO GLOBAL ----------
    let jugadorActual = "Invitado";
    let resultados = [];
    let modoConjugacion = 'indicativo';

    let juego = {
      activo: false,
      tipo: null,
      preguntas: [],
      indice: 0,
      aciertos: 0,
      totalPreguntas: 20,
      tiempoRestante: 600,
      timerInterval: null,
      bloqueado: false,
      finalizado: false,
      tiempoTotalInicial: 600
    };

    // ---------- REFERENCIAS DOM ----------
    const mainMenu = document.getElementById('mainMenu');
    const gameScreen = document.getElementById('gameScreen');
    const gamePlayArea = document.getElementById('gamePlayArea');
    const resultScreen = document.getElementById('resultScreen');
    const btnTiempos = document.getElementById('btnTiempos');
    const btnAnalisis = document.getElementById('btnAnalisis');
    const addPlayerBtn = document.getElementById('addPlayerBtn');
    const playerNameInput = document.getElementById('playerNameInput');
    const currentPlayerDisplay = document.getElementById('currentPlayerDisplay');
    const resultsList = document.getElementById('resultsList');
    const gameModeLabel = document.getElementById('gameModeLabel');
    const questionCounter = document.getElementById('questionCounter');
    const timerDisplay = document.getElementById('timerDisplay');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const backToMenuBtn = document.getElementById('backToMenuBtn');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const tipoConjugacionRadios = document.querySelectorAll('input[name="conj"]');

    const resultTitle = document.getElementById('resultTitle');
    const resultBigScore = document.getElementById('resultBigScore');
    const resultName = document.getElementById('resultName');
    const resultTime = document.getElementById('resultTime');
    const resultMode = document.getElementById('resultMode');
    const resultBackBtn = document.getElementById('resultBackBtn');

    // ---------- FUNCIONES AUXILIARES ----------
    function getModoSeleccionado() {
      for (let radio of tipoConjugacionRadios) {
        if (radio.checked) return radio.value;
      }
      return 'indicativo';
    }

    function obtenerTiemposDisponibles(modo) {
      const tiempos = [];
      for (let v of VERBOS) {
        if (modo === 'indicativo' || modo === 'todos') {
          for (let t in v.conjugaciones.indicativo) {
            tiempos.push({ modo: 'indicativo', tiempo: t, etiqueta: ETIQUETAS_TIEMPO[t] || t });
          }
        }
        if (modo === 'subjuntivo' || modo === 'todos') {
          for (let t in v.conjugaciones.subjuntivo) {
            tiempos.push({ modo: 'subjuntivo', tiempo: t, etiqueta: ETIQUETAS_TIEMPO[t] || t });
          }
        }
      }
      const unicos = [];
      const set = new Set();
      for (let item of tiempos) {
        const key = item.modo + '|' + item.tiempo;
        if (!set.has(key)) { set.add(key); unicos.push(item); }
      }
      return unicos;
    }

    function formatearTiempo(segundos) {
      const m = Math.floor(segundos / 60);
      const s = segundos % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    // --- JUEGO 1: TIEMPOS VERBALES ---
    function generarPreguntaTiempos() {
      const modoSel = getModoSeleccionado();
      const tiemposDisp = obtenerTiemposDisponibles(modoSel);
      if (tiemposDisp.length === 0) return null;

      const verboObjCorrecto = VERBOS[Math.floor(Math.random() * VERBOS.length)];
      const opcionesValidas = tiemposDisp.filter(t => verboObjCorrecto.conjugaciones[t.modo]?.[t.tiempo]);
      if (opcionesValidas.length === 0) return null;
      const tiempoObjetivo = opcionesValidas[Math.floor(Math.random() * opcionesValidas.length)];

      const formaCorrecta = verboObjCorrecto.conjugaciones[tiempoObjetivo.modo][tiempoObjetivo.tiempo];
      const etiquetaTiempo = tiempoObjetivo.etiqueta;
      const textoPregunta = `¿Cuál de estos verbos está en ${etiquetaTiempo.toLowerCase()} (${tiempoObjetivo.modo})?`;

      const opcionesIncorrectas = [];
      const tiemposNoObjetivo = tiemposDisp.filter(t => 
        t.etiqueta !== etiquetaTiempo || t.modo !== tiempoObjetivo.modo
      );
      const shuffledTiempos = [...tiemposNoObjetivo].sort(() => Math.random() - 0.5);
      const usados = new Set();
      for (let t of shuffledTiempos) {
        if (opcionesIncorrectas.length >= 3) break;
        const posiblesVerbos = VERBOS.filter(v => v.conjugaciones[t.modo]?.[t.tiempo]);
        if (posiblesVerbos.length === 0) continue;
        const v = posiblesVerbos[Math.floor(Math.random() * posiblesVerbos.length)];
        const forma = v.conjugaciones[t.modo][t.tiempo];
        if (forma && forma !== formaCorrecta && !usados.has(forma)) {
          usados.add(forma);
          opcionesIncorrectas.push(forma);
        }
      }
      while (opcionesIncorrectas.length < 3) {
        opcionesIncorrectas.push("hablaba");
      }

      let opciones = [formaCorrecta, ...opcionesIncorrectas.slice(0, 3)];
      opciones = opciones.sort(() => Math.random() - 0.5);

      return {
        texto: textoPregunta,
        opciones: opciones,
        correcta: formaCorrecta,
        modo: tiempoObjetivo.modo,
        tiempo: tiempoObjetivo.tiempo,
        etiquetaTiempo: etiquetaTiempo,
        verbo: verboObjCorrecto.verbo
      };
    }

    // --- JUEGO 2: ANÁLISIS DE CONJUGACIÓN ---
    function generarPreguntaAnalisis() {
      const modoSel = getModoSeleccionado();
      const tiemposDisp = obtenerTiemposDisponibles(modoSel);
      if (tiemposDisp.length === 0) return null;

      const verboObj = VERBOS[Math.floor(Math.random() * VERBOS.length)];
      const opcionesValidas = tiemposDisp.filter(t => verboObj.conjugaciones[t.modo]?.[t.tiempo]);
      if (opcionesValidas.length === 0) return null;
      const tiempoElegido = opcionesValidas[Math.floor(Math.random() * opcionesValidas.length)];

      const formaCorrecta = verboObj.conjugaciones[tiempoElegido.modo][tiempoElegido.tiempo];

      const pregunta = {
        texto: `Analiza la forma verbal: "${formaCorrecta}" (verbo ${verboObj.verbo}). ¿En qué tiempo está conjugada?`,
        opciones: [],
        correcta: tiempoElegido.etiqueta,
        modo: tiempoElegido.modo,
        tiempo: tiempoElegido.tiempo,
        forma: formaCorrecta,
        verbo: verboObj.verbo
      };

      const opcionesIncorrectas = [];
      const todasEtiquetas = tiemposDisp.map(t => t.etiqueta).filter(e => e !== tiempoElegido.etiqueta);
      const shuffled = [...new Set(todasEtiquetas)].sort(() => Math.random() - 0.5);
      for (let i = 0; i < 3 && i < shuffled.length; i++) {
        opcionesIncorrectas.push(shuffled[i]);
      }
      while (opcionesIncorrectas.length < 3) {
        opcionesIncorrectas.push("Pretérito imperfecto");
      }
      let opciones = [pregunta.correcta, ...opcionesIncorrectas.slice(0,3)];
      opciones = opciones.sort(() => Math.random() - 0.5);
      pregunta.opciones = opciones;
      return pregunta;
    }

    function generarPreguntas(tipo) {
      const preguntas = [];
      for (let i = 0; i < 20; i++) {
        let p = (tipo === 'tiempos') ? generarPreguntaTiempos() : generarPreguntaAnalisis();
        if (p) preguntas.push(p);
        else {
          preguntas.push({
            texto: "¿Qué tiempo verbal es 'hablo'?",
            opciones: ["Presente", "Pretérito perfecto simple", "Futuro", "Condicional"],
            correcta: "Presente",
            modo: "indicativo", tiempo: "presente", forma: "hablo", verbo: "hablar"
          });
        }
      }
      return preguntas;
    }

    function iniciarJuego(tipo) {
      if (juego.timerInterval) clearInterval(juego.timerInterval);

      modoConjugacion = getModoSeleccionado();
      const preguntasGeneradas = generarPreguntas(tipo);

      juego = {
        activo: true,
        tipo: tipo,
        preguntas: preguntasGeneradas,
        indice: 0,
        aciertos: 0,
        totalPreguntas: 20,
        tiempoRestante: 600,
        timerInterval: null,
        bloqueado: false,
        finalizado: false,
        tiempoTotalInicial: 600
      };

      mainMenu.style.display = 'none';
      gameScreen.style.display = 'flex';
      gamePlayArea.style.display = 'flex';
      resultScreen.style.display = 'none';

      gameModeLabel.textContent = (tipo === 'tiempos') ? 'Tiempos verbales' : 'Análisis de conjugación';

      actualizarTimerDisplay();
      juego.timerInterval = setInterval(() => {
        if (!juego.activo) return;
        juego.tiempoRestante--;
        actualizarTimerDisplay();
        if (juego.tiempoRestante <= 0) {
          clearInterval(juego.timerInterval);
          finalizarJuego(true);
        }
      }, 1000);

      mostrarPregunta(0);
    }

    function actualizarTimerDisplay() {
      timerDisplay.textContent = formatearTiempo(juego.tiempoRestante);
    }

    function mostrarPregunta(indice) {
      if (indice >= juego.preguntas.length || !juego.activo) {
        finalizarJuego(false);
        return;
      }
      juego.bloqueado = false;
      feedbackMsg.textContent = '';
      const p = juego.preguntas[indice];
      questionText.textContent = p.texto;
      questionCounter.textContent = `${indice + 1} / ${juego.totalPreguntas}`;

      optionsContainer.innerHTML = '';
      p.opciones.forEach(opcion => {
        const btn = document.createElement('button');
        btn.classList.add('option-btn');
        btn.textContent = opcion;
        btn.dataset.opcion = opcion;
        btn.addEventListener('click', (e) => seleccionarOpcion(e, p));
        optionsContainer.appendChild(btn);
      });
    }

    function seleccionarOpcion(event, pregunta) {
      if (juego.bloqueado || !juego.activo) return;
      juego.bloqueado = true;
      const boton = event.currentTarget;
      const opcionElegida = boton.dataset.opcion;
      const esCorrecta = (opcionElegida === pregunta.correcta);

      if (esCorrecta) {
        boton.classList.add('correct');
        juego.aciertos++;
        feedbackMsg.textContent = '✅ ¡Correcto!';
      } else {
        boton.classList.add('incorrect');
        feedbackMsg.textContent = `❌ Incorrecto. La respuesta correcta es: ${pregunta.correcta}`;
        document.querySelectorAll('.option-btn').forEach(btn => {
          if (btn.dataset.opcion === pregunta.correcta) btn.classList.add('correct');
        });
      }
      document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

      setTimeout(() => {
        if (!juego.activo) return;
        juego.indice++;
        if (juego.indice < juego.totalPreguntas) {
          mostrarPregunta(juego.indice);
        } else {
          finalizarJuego(false);
        }
      }, 1200);
    }

    function finalizarJuego(porTiempo) {
      if (!juego.activo) return;
      juego.activo = false;
      juego.finalizado = true;
      if (juego.timerInterval) {
        clearInterval(juego.timerInterval);
        juego.timerInterval = null;
      }

      const segundosJugados = porTiempo ? juego.tiempoTotalInicial : (juego.tiempoTotalInicial - juego.tiempoRestante);
      const tiempoFormateado = formatearTiempo(segundosJugados);

      const aciertosFinales = juego.aciertos;
      const total = juego.totalPreguntas;
      const modoTexto = (juego.tipo === 'tiempos') ? 'Tiempos' : 'Análisis';

      resultados.unshift({
        nombre: jugadorActual,
        modo: modoTexto,
        aciertos: aciertosFinales,
        total: total,
        tiempoDedicado: tiempoFormateado
      });
      if (resultados.length > 8) resultados.pop();
      actualizarListaResultados();

      gamePlayArea.style.display = 'none';
      resultScreen.style.display = 'flex';
      resultTitle.textContent = porTiempo ? '⏰ ¡Tiempo agotado!' : '🏁 ¡Juego completado!';
      resultBigScore.textContent = `${aciertosFinales} / ${total}`;
      resultName.textContent = jugadorActual;
      resultTime.textContent = tiempoFormateado;
      resultMode.textContent = modoTexto;
    }

    function actualizarListaResultados() {
      if (resultados.length === 0) {
        resultsList.innerHTML = '<div class="empty-msg">Aún no hay partidas jugadas</div>';
        return;
      }
      resultsList.innerHTML = '';
      for (let r of resultados) {
        const div = document.createElement('div');
        div.classList.add('result-item');
        div.innerHTML = `
          <span class="name">👤 ${r.nombre}</span>
          <span class="time">⏱ ${r.tiempoDedicado} · ${r.modo}</span>
          <span class="score">${r.aciertos}/${r.total}</span>
        `;
        resultsList.appendChild(div);
      }
    }

    function volverAlMenu() {
      if (juego.timerInterval) clearInterval(juego.timerInterval);
      juego.activo = false;
      gameScreen.style.display = 'none';
      gamePlayArea.style.display = 'flex';
      resultScreen.style.display = 'none';
      mainMenu.style.display = 'block';
    }

    // ---------- EVENT LISTENERS ----------
    btnTiempos.addEventListener('click', () => iniciarJuego('tiempos'));
    btnAnalisis.addEventListener('click', () => iniciarJuego('analisis'));

    addPlayerBtn.addEventListener('click', () => {
      const nombre = playerNameInput.value.trim();
      if (nombre) {
        jugadorActual = nombre;
        currentPlayerDisplay.textContent = jugadorActual;
        playerNameInput.value = '';
      } else {
        alert('Introduce un nombre para el jugador');
      }
    });

    backToMenuBtn.addEventListener('click', () => {
      if (juego.activo) {
        if (confirm('¿Abandonar la partida actual? Se perderá el progreso.')) {
          volverAlMenu();
        }
      } else {
        volverAlMenu();
      }
    });

    resultBackBtn.addEventListener('click', volverAlMenu);

    tipoConjugacionRadios.forEach(radio => {
      radio.addEventListener('change', () => {
        modoConjugacion = getModoSeleccionado();
      });
    });

    actualizarListaResultados();
    currentPlayerDisplay.textContent = jugadorActual;
  })();
</script>
</body>
</html>
